<title>Dyffle Conduct</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: task sidebar | post rail + composer | artifact viewer (any HTML, or a dyffle map) | diff sheet. Tokens are the dyffle viewer's own. */
:root{
  --bg:#E8ECF0; --surface:#F8FAFB; --surface-2:#EEF2F5; --ink:#18202B; --muted:#535D6B; --line:#CBD3DC; --edge:#748397; --stroke:#7A889B;
  --accent:#3B4FD8; --accent-soft:#E2E6FB; --on-accent:#FFFFFF;
  --add:#157548; --add-bg:#DCF2E5; --del:#B03731; --del-bg:#F8E0DD; --mod:#905807; --mod-bg:#F5E9D2;
  --kw:#7A3BB8; --str:#1C7267; --dec:#A8530F; --com:#5C6671;
  --pr:#79438F; --pr-bg:#EFE3F4; --shadow:rgba(15,20,30,.14);
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151B; --surface:#192029; --surface-2:#202833; --ink:#E3E8EE; --muted:#95A0AE; --line:#2D3744; --edge:#657488; --stroke:#5E738E;
  --accent:#93A1FF; --accent-soft:#252C4F; --on-accent:#11151B;
  --add:#4FC48C; --add-bg:#16301F; --del:#F08A80; --del-bg:#3A1E1C; --mod:#E2AA4C; --mod-bg:#372A13;
  --kw:#C79BFF; --str:#6DD3C2; --dec:#F0A963; --com:#8B94A0; --pr:#C69BE0; --pr-bg:#33243D; --shadow:rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151B; --surface:#192029; --surface-2:#202833; --ink:#E3E8EE; --muted:#95A0AE; --line:#2D3744; --edge:#657488; --stroke:#5E738E;
  --accent:#93A1FF; --accent-soft:#252C4F; --on-accent:#11151B;
  --add:#4FC48C; --add-bg:#16301F; --del:#F08A80; --del-bg:#3A1E1C; --mod:#E2AA4C; --mod-bg:#372A13;
  --kw:#C79BFF; --str:#6DD3C2; --dec:#F0A963; --com:#8B94A0; --pr:#C69BE0; --pr-bg:#33243D; --shadow:rgba(0,0,0,.45); color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code{font-family:var(--mono);font-size:.9em}
.app{height:100%;display:flex;padding-left:60px;position:relative}

/* Sidebar: a 60px strip of task icons that unfolds over the page on hover */
.side{position:absolute;z-index:30;inset:60px auto 0 0;width:60px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;transition:width .18s ease,box-shadow .18s ease}
@media (min-width:901px){.side:hover,.side:has(:focus-visible){width:300px;box-shadow:8px 0 32px var(--shadow)}}
@media (prefers-reduced-motion: reduce){.side{transition:none}}
.brand{display:flex;align-items:center;gap:12px;height:57px;padding:0 12px;flex:none;white-space:nowrap;border-bottom:1px solid var(--line)}
.mark{flex:none;width:36px;height:36px;border-radius:10px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;font:600 16px var(--mono)}
.brand b{font-weight:600;font-size:15px}
.brand small{color:var(--muted);font-size:12.5px;margin-left:6px}
.wslist{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px;display:flex;flex-direction:column;gap:4px;scrollbar-width:none}
.wsi{display:flex;align-items:flex-start;gap:12px;width:280px;flex:none;padding:6px 4px;border:0;border-radius:10px;background:none;text-align:left}
.wsi:hover{background:var(--surface-2)}
.wsi.on{background:var(--accent-soft)}
.ico{position:relative;flex:none;width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--bg);display:flex;align-items:center;justify-content:center;font:600 11.5px var(--mono);color:var(--muted)}
.wsi.on .ico{border-color:var(--accent);color:var(--accent)}
.ico i{position:absolute;right:-4px;bottom:-4px;width:12px;height:12px;border-radius:50%;border:2px solid var(--surface);background:var(--line)}
.ico i.st-running{background:var(--accent);animation:pulse 1.2s ease-in-out infinite}
.ico i.st-input{background:var(--mod)} .ico i.st-review{background:var(--add)} .ico i.st-pr{background:var(--pr)}
.ico b{position:absolute;right:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.wtx{min-width:0;flex:1;display:grid;gap:3px;padding:6px 6px 6px 0}
.wst{font-weight:500;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wsm{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);white-space:nowrap}
.wsm .m{font-family:var(--mono)}
.wsr{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.ttag{font:500 10.5px var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.newbtn{display:flex;align-items:center;gap:12px;width:280px;flex:none;margin:0 10px 12px;padding:4px;border:0;border-radius:10px;background:none;text-align:left;font-weight:500;white-space:nowrap}
.newbtn span{flex:none;width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-size:18px}
.newbtn:hover{background:var(--surface-2)}
.rtag{font:11.5px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px;background:var(--surface)}

.pill{display:inline-flex;align-items:center;gap:6px;font:500 12.5px var(--sans);white-space:nowrap;color:var(--muted)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.st-running i{background:var(--accent);animation:pulse 1.2s ease-in-out infinite}
.st-input{color:var(--mod)} .st-input i{background:var(--mod)}
.st-review i{background:var(--add)}
.st-pr i{background:var(--pr)}
.cnt{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--mod);color:var(--surface);font:600 11px var(--sans);display:inline-flex;align-items:center;justify-content:center}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.st-running i{animation:none}}
.a{color:var(--add)} .d{color:var(--del)}

/* Workspace */
.ws{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.wshead{display:flex;align-items:center;gap:16px;height:60px;flex:none;margin-left:-60px;padding:0 20px 0 0;background:var(--surface);border-bottom:1px solid var(--line)}
/* The logo sits in the header, in a 60px cell over the task strip, so the strip's edge and the header's line meet */
.hmark{flex:none;align-self:stretch;width:60px;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line)}
.iconbtn.menubtn{display:none}
.wstitle{flex:1 1 320px;min-width:0}
.wstitle h2{margin:0;font-size:16px;font-weight:600;line-height:1.3;text-wrap:balance}
.wstitle p{margin:2px 0 0;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wsact{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 12px;border:1px solid var(--stroke);border-radius:10px;background:var(--surface);font-weight:500;font-size:13.5px}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn .n{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:12px;display:inline-flex;align-items:center;justify-content:center}
.btn.primary .n{background:var(--on-accent);color:var(--accent)}
.btn .n.z{background:var(--surface-2);color:var(--muted)}
.prlinks{display:inline-flex;gap:6px;flex-wrap:wrap}
.prlinks span{font:500 12.5px var(--mono);color:var(--pr);border:1px solid var(--pr);border-radius:8px;padding:4px 8px}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;padding:0 8px;border:1px solid var(--stroke);border-radius:10px;background:var(--surface)}
.iconbtn:hover{border-color:var(--muted)}
.iconbtn:disabled{opacity:.4;cursor:default}
.iconbtn.ghost,.btn.ghost{border-color:transparent;background:none}
.iconbtn.ghost{color:var(--muted)}
.iconbtn.ghost:hover,.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}

.mtabs{display:none}
.body{flex:1;min-height:0;display:grid;grid-template-columns:360px minmax(0,1fr)}
.body.withsheet{grid-template-columns:360px minmax(0,1fr) 500px}
.body.nochat{grid-template-columns:minmax(0,1fr)}
.body.nochat.withsheet{grid-template-columns:minmax(0,1fr) 500px}
.body.nochat .rail{display:none}

/* Rail: the feed of posts */
.rail{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--surface)}
.railhd{display:flex;align-items:center;gap:2px;padding:8px 8px 6px;border-bottom:1px solid var(--line)}
.threads{flex:1;min-width:0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.threads::-webkit-scrollbar{display:none}
.threads button{flex:none;position:relative;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:0;border-radius:8px;background:none;font-size:13px;color:var(--muted);white-space:nowrap}
.threads button:hover{background:var(--surface-2);color:var(--ink)}
.threads button.on{background:var(--surface-2);color:var(--ink);font-weight:500}
.threads i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.threads i.st-running{background:var(--accent);animation:pulse 1.2s ease-in-out infinite}
.threads i.st-input{background:var(--mod)} .threads i.st-review{background:var(--add)}
.threads b{position:absolute;top:4px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
#addag{font-size:17px;padding:0 9px}
#tx[aria-pressed="true"]{color:var(--accent);background:var(--accent-soft)}
.post .by{flex:1;font:600 11px var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.post>h3{margin:2px 0 0;font-size:14px;font-weight:600;line-height:1.35}
.fi.tool i{font-style:normal;color:var(--accent)}
.toline{display:flex;align-items:center;gap:8px;margin:0 2px 8px;font-size:12.5px;color:var(--muted)}
.toline select{height:28px;padding:0 6px;border:1px solid var(--stroke);border-radius:8px;background:var(--bg);font-size:13px}
.working em{font-style:normal;color:var(--muted)}
/* The collapsed chat: a tab attached to the current task's icon in the strip */
.chattab{position:absolute;z-index:25;left:76px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:46px;height:46px;display:flex;align-items:center;justify-content:center;border:0;border-radius:50%;background:var(--accent);color:var(--on-accent);box-shadow:0 6px 20px var(--shadow)}
.chattab:hover{filter:brightness(1.08)}
.chattab b{position:absolute;top:1px;right:1px;width:12px;height:12px;border-radius:50%;background:var(--mod);border:2px solid var(--bg)}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
.switch input{appearance:none;width:30px;height:18px;border-radius:999px;background:var(--line);position:relative;margin:0;cursor:pointer;transition:background .15s;flex:none}
.switch input::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(12px)}
.feed{flex:1;overflow:auto;padding:14px 16px 20px;display:flex;flex-direction:column;gap:10px}
.fi{min-width:0}
.fi.prompt,.fi.user{align-self:flex-end;max-width:92%;background:var(--accent-soft);border-radius:12px 12px 4px 12px;padding:9px 12px}
.who{display:block;font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.fi.status{font-size:12.5px;color:var(--muted);text-align:center;padding:2px 8px}
.fi.status code{color:var(--ink)}
.fi.tool{font:12px var(--mono);color:var(--muted);padding-left:4px;display:flex;gap:7px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.fi.tool b{font-weight:500;color:var(--ink)}
.post{border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:11px 13px 12px}
.post.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.post header{display:flex;align-items:baseline;gap:8px}
.post header b{font:600 12.5px var(--mono);color:var(--muted)}
.post header h3{margin:0;font-size:14px;font-weight:600;line-height:1.35;flex:1}
.post header time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.md{font-size:13.5px;line-height:1.55}
.md p{margin:6px 0 0}
.md ul{margin:6px 0 0;padding-left:18px}
.md code{background:var(--surface-2);border-radius:4px;padding:0 3px}
.ref{border:0;padding:0 3px;border-radius:4px;background:var(--accent-soft);color:var(--accent);font:.9em var(--mono);cursor:pointer}
.ref:hover{text-decoration:underline}
.chg{margin-top:10px;width:100%;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:7px 10px;border:1px solid var(--stroke);border-radius:9px;background:var(--surface);font-size:12.5px;text-align:left}
.chg:hover{border-color:var(--accent)}
.chg .k{font:500 11px var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.chg .m{font-family:var(--mono)}
.chg .go{margin-left:auto;font-weight:500;color:var(--accent)}
.post.sel .chg{border-color:var(--accent);background:var(--accent-soft)}
.postfoot{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-size:12px;color:var(--muted)}
.review{align-self:flex-end;max-width:92%;border:1px solid var(--line);background:var(--accent-soft);border-radius:12px 12px 4px 12px;padding:9px 12px}
.review ul{margin:6px 0 0;padding-left:16px;font-size:13px}
.review li code{font-size:11.5px;color:var(--muted)}
.composer{border-top:1px solid var(--line);padding:10px 12px 12px;background:var(--surface)}
.working{display:flex;align-items:center;gap:8px;margin:0 2px 8px;font:12px var(--mono);color:var(--accent);min-width:0}
.working span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.working button{font:500 12px var(--sans);border:1px solid var(--stroke);background:var(--surface);border-radius:7px;height:24px;padding:0 8px;color:var(--ink)}
.cbox{display:flex;gap:8px;align-items:flex-end;border:1px solid var(--stroke);border-radius:12px;background:var(--bg);padding:6px 6px 6px 12px}
.cbox:focus-within{border-color:var(--accent)}
.cbox textarea{flex:1;border:0;background:none;resize:none;outline:none;min-height:40px;max-height:160px;padding:4px 0;line-height:1.45}
.cbox .btn{height:32px}

/* Stage: the artifact viewer */
.stage{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0}
.shelf{display:flex;gap:4px;padding:8px 16px 0;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--surface);scrollbar-width:none}
.shelf::-webkit-scrollbar{display:none}
.shelf button{flex:none;display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:1px solid transparent;border-bottom:0;border-radius:10px 10px 0 0;background:none;font-size:13px;color:var(--muted);margin-bottom:-1px}
.shelf button.on{background:var(--bg);border-color:var(--line);color:var(--ink);font-weight:500}
.shelf .k{font:500 10.5px var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.shelf .v{font:11.5px var(--mono);color:var(--muted)}
.stagebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 16px}
.picker{display:flex;align-items:center;gap:4px;min-width:0}
.picker select{height:34px;max-width:320px;min-width:0;padding:0 8px;border:1px solid var(--stroke);border-radius:10px;background:var(--surface);font-size:13px}
.rfilter{display:flex;gap:2px;padding:2px;border:1px solid var(--stroke);border-radius:10px;background:var(--surface)}
.rfilter button{height:28px;padding:0 9px;border:0;border-radius:8px;background:none;font-size:12.5px;color:var(--muted);white-space:nowrap}
.rfilter button.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.rfilter small{font:11.5px var(--mono);margin-left:4px}
.vnote{font-size:12.5px;color:var(--muted);min-width:0;flex:1 1 200px}
.vnote b{color:var(--ink);font-weight:500}
.livetag{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.livetag i{width:7px;height:7px;border-radius:50%;background:var(--add)}
.livetag.on i{animation:pulse 1.2s ease-in-out infinite}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-left:auto}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.oldver{margin:0 16px 8px;padding:7px 12px;border-radius:9px;background:var(--mod-bg);color:var(--mod);font-size:12.5px;display:flex;gap:10px;align-items:center}
.oldver button{margin-left:auto;border:0;background:none;color:inherit;font-weight:600;text-decoration:underline}
.docwrap{flex:1;min-height:0;overflow:auto;background:var(--bg);border-top:1px solid var(--line)}
.mapwrap{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.canvas{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none;cursor:grab;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px}
.canvas.panning{cursor:grabbing}
.canvas svg{position:absolute;left:0;top:0;transform-origin:0 0;overflow:visible}
.zoomctl{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;border:1px solid var(--stroke);border-radius:10px;background:var(--surface);box-shadow:0 4px 14px var(--shadow);overflow:hidden}
.zoomctl button{width:38px;height:36px;border:0;background:none;font:500 16px var(--sans)}
.zoomctl button+button{border-top:1px solid var(--line)}
.zoomctl button:hover{background:var(--surface-2)}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:20px}
.rfr>rect{fill:color-mix(in srgb,var(--bg) 55%,transparent);stroke:var(--stroke);stroke-width:1.2}
.rfr .rn{font:600 15px var(--sans);fill:var(--ink)}
.rfr .rk{font:12px var(--mono);fill:var(--muted)}
.mod rect{fill:color-mix(in srgb,var(--surface) 45%,transparent);stroke:var(--line);stroke-dasharray:4 4}
.mod .mn{font:600 12.5px var(--sans);fill:var(--muted)}
.mod .mp{font:11.5px var(--mono);fill:var(--muted)}
.node{cursor:pointer}
.node rect.box{fill:var(--surface);stroke:var(--stroke);stroke-width:1}
.node:hover rect.box{stroke:var(--muted)}
.node.sel rect.box{stroke:var(--accent);stroke-width:2}
.node.ctx rect.box{fill:var(--surface-2)}
.node .bar{fill:var(--line)}
.node.s-modified .bar{fill:var(--mod)}
.node.s-added .bar{fill:var(--add)}
.node .nm{font:600 13.5px var(--sans);fill:var(--ink)}
.node.ctx .nm{font-weight:500}
.node .pth{font:11.5px var(--mono);fill:var(--muted)}
.node .meta{font:500 12px var(--mono);fill:var(--muted)}
.node .meta .a{fill:var(--add)} .node .meta .d{fill:var(--del)}
.node .nv path{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-linejoin:round}
.node .nv circle{fill:var(--accent)}
.node .cc{fill:var(--accent)}
.node .cct{font:600 10.5px var(--sans);fill:var(--on-accent)}
.node:focus{outline:none}
.node:focus-visible rect.box{stroke:var(--accent);stroke-width:2}
.node.fresh rect.box{animation:flash 1.4s ease-out}
@keyframes flash{0%{stroke:var(--accent);stroke-width:4}100%{stroke-width:1}}
@media (prefers-reduced-motion: reduce){.node.fresh rect.box{animation:none}}
.edge{fill:none;stroke:var(--edge);stroke-width:1.3}
.edge.hot{stroke:var(--accent);stroke-width:2}
.arrow{fill:var(--edge)}

/* Sheet: a file's diff */
.sheet{display:flex;flex-direction:column;min-width:0;min-height:0;border-left:1px solid var(--line);background:var(--surface)}
.shhd{display:flex;align-items:flex-start;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.shhd div{flex:1;min-width:0}
.shhd h3{margin:0;font-size:15px;font-weight:600;word-break:break-all}
.shhd code{color:var(--muted);font-size:12px;word-break:break-all}
.shhd .rtag{margin-right:6px}
.shbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:12.5px}
.shbar .stl{font:500 12px var(--mono)}
.since{color:var(--mod);font-size:12px}
.syms{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line)}
.sym{font:12px var(--mono);border:1px solid var(--line);border-radius:6px;padding:2px 7px;background:var(--bg)}
.sym::before{content:"";display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:6px;background:var(--line)}
.sym.added::before{background:var(--add)} .sym.modified::before{background:var(--mod)}
.diff{flex:1;overflow:auto;font:12.5px/1.6 var(--mono);padding-bottom:20px}
.hh{padding:4px 16px;color:var(--muted);background:var(--surface-2);border-block:1px solid var(--line);margin-top:10px;font-size:12px}
.hh:first-child{margin-top:0;border-top:0}
.dl{display:grid;grid-template-columns:24px 40px 40px max-content;min-width:100%;position:relative}
.dl .ln{color:var(--muted);text-align:right;padding-right:8px;user-select:none;font-variant-numeric:tabular-nums}
.dl .cd{white-space:pre;padding:0 16px 0 10px}
.dl.add{background:var(--add-bg)} .dl.add .cd::before{content:"+";position:absolute;margin-left:-9px;color:var(--add)}
.dl.del{background:var(--del-bg)} .dl.del .cd::before{content:"−";position:absolute;margin-left:-9px;color:var(--del)}
.addc{width:20px;height:20px;margin:0 2px;border-radius:6px;border:0;background:var(--accent);color:var(--on-accent);font:600 14px/1 var(--sans);opacity:0;align-self:center}
.dl:hover .addc,.addc:focus-visible{opacity:1}
.kw{color:var(--kw)} .str{color:var(--str)} .dec{color:var(--dec)} .com{color:var(--com);font-style:italic}
.thread{font:13px/1.5 var(--sans);margin:6px 16px 8px 64px;max-width:380px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:8px 10px}
.thread b{font-weight:600;font-size:12px}
.thread p{margin:2px 0 0;white-space:pre-wrap}
.thread .row{display:flex;align-items:center;gap:8px}
.thread .row button{margin-left:auto;border:0;background:none;color:var(--muted);font-size:12px}
.thread textarea{width:100%;min-height:64px;border:1px solid var(--stroke);border-radius:8px;background:var(--bg);padding:6px 8px;resize:vertical}
.thread .acts{display:flex;justify-content:flex-end;gap:6px;margin-top:6px}
.thread .acts .btn{height:30px;font-size:13px}
.ctxinfo{padding:16px;color:var(--muted);font-size:13.5px}
.ctxinfo ul{padding-left:18px}

/* Popover, modals, toast */
.pop{position:fixed;z-index:30;width:min(440px,calc(100vw - 32px));max-height:min(72vh,600px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px var(--shadow);padding:14px 16px}
.pop h4{margin:0 0 4px;font-size:14px}
.pop h5{margin:12px 0 2px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.pop .hint{margin:0 0 10px;font-size:12.5px;color:var(--muted)}
.pop textarea{width:100%;min-height:64px;border:1px solid var(--stroke);border-radius:10px;background:var(--bg);padding:8px 10px;resize:vertical}
.rc{border-top:1px solid var(--line);padding:8px 0;font-size:13px}
.rc .loc{display:flex;gap:8px;font:12px var(--mono);color:var(--muted)}
.rc .loc button{margin-left:auto;border:0;background:none;color:var(--muted);font:12px var(--sans)}
.rc pre{margin:4px 0;font:12px var(--mono);background:var(--bg);border-radius:6px;padding:3px 7px;overflow:auto}
.rc .ans{display:flex;gap:10px;justify-content:space-between}
.rc .ans span:first-child{color:var(--muted)}
.rc .ans b{font-weight:500;text-align:right}
.pop .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
.scrim{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--ink) 35%,transparent);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{width:min(600px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 60px var(--shadow);padding:20px}
.modal h3{margin:0;font-size:17px}
.modal .hint{margin:4px 0 14px;font-size:13px;color:var(--muted)}
.field{display:grid;gap:5px;margin-bottom:12px}
.field>label,.field>legend{font-size:12.5px;font-weight:500;color:var(--muted);padding:0}
fieldset.field{border:0;margin:0 0 12px;padding:0;min-width:0}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--stroke);border-radius:10px;background:var(--bg);padding:8px 10px}
.field textarea{resize:vertical}
.types{display:flex;flex-wrap:wrap;gap:6px}
.types label{position:relative}
.types input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.types span{display:block;padding:6px 12px;border:1px solid var(--stroke);border-radius:999px;font-size:13px;background:var(--bg)}
.types input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.types input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.rpick{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.rpick+.rpick{margin-top:6px}
.rpick label{display:flex;align-items:center;gap:10px;min-width:0}
.rpick input[type=checkbox]{width:16px;height:16px;margin:0;accent-color:var(--accent);flex:none}
.rpick small{color:var(--muted);font:12px var(--mono)}
.rpick select{height:32px;padding:0 8px}
.rpick.off select{opacity:.4}
.prrepo{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:var(--bg)}
.prrepo>label{display:flex;align-items:center;gap:10px;font-weight:500;margin-bottom:8px}
.prrepo>label small{margin-left:auto;font:12px var(--mono);color:var(--muted)}
.prrepo input[type=checkbox]{width:16px;height:16px;margin:0;accent-color:var(--accent)}
.prrepo textarea{width:100%;border:1px solid var(--stroke);border-radius:10px;background:var(--surface);padding:8px 10px;font:12.5px/1.5 var(--mono);min-height:170px;resize:vertical}
.prrepo.none{color:var(--muted);font-size:13px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.steps{margin:0 0 14px;padding:10px 12px;border-radius:10px;background:var(--bg);font-size:12.5px;color:var(--muted);display:grid;gap:3px}
.steps code{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13.5px;box-shadow:0 8px 24px var(--shadow);max-width:calc(100vw - 32px)}

/* Phones */
@media (max-width: 900px){
  .app{padding-left:0}
  .side{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:35;transform:translateX(-102%);transition:transform .2s;box-shadow:0 0 40px var(--shadow);padding-top:env(safe-area-inset-top,0px)}
  .side.open{transform:none}
  .iconbtn.menubtn{display:inline-flex}
  .wshead{height:auto;min-height:56px;margin-left:0;padding:8px 16px 8px 0;flex-wrap:wrap;gap:10px}
  .hmark{width:56px}
  .wstitle{flex-basis:200px}
  .mtabs{display:flex;gap:4px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
  .mtabs button{flex:1;height:34px;border:1px solid var(--line);border-radius:9px;background:none;font-weight:500;font-size:13px}
  .mtabs button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .body,.body.withsheet,.body.nochat.withsheet{grid-template-columns:minmax(0,1fr)}
  .chattab,#chatcollapse{display:none !important}
  .body.nochat .rail{display:flex}
  .body[data-tab="art"] .rail{display:none}
  .body[data-tab="feed"] .stage{display:none}
  .rail{border-right:0}
  .sheet{position:fixed;inset:0;z-index:36;border:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .legend{display:none}
  .rpick{grid-template-columns:1fr}
  .addc{opacity:1}
}
</style>

<div class="app">
  <aside class="side" id="side">
    <div class="wslist" id="wslist"></div>
    <button class="newbtn" id="newws"><span aria-hidden="true">+</span>New workspace</button>
  </aside>
  <button class="chattab" id="chattab" hidden aria-label="Open chat" title="Open chat (\)"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 4.5A1.5 1.5 0 0 1 4.5 3h9A1.5 1.5 0 0 1 15 4.5v6a1.5 1.5 0 0 1-1.5 1.5H8l-3.5 3v-3h0A1.5 1.5 0 0 1 3 10.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg><b hidden></b></button>

  <section class="ws">
    <header class="wshead">
      <span class="hmark"><span class="mark" role="img" aria-label="acme conduct">d</span></span>
      <button class="iconbtn menubtn" id="menubtn" aria-label="Tasks"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.6"/></svg></button>
      <div class="wstitle"><h2 id="wtitle"></h2><p id="wsub"></p></div>
      <div class="wsact" id="wsact"></div>
    </header>

      <div class="rail">
        <div class="railhd"><button class="iconbtn ghost" id="chatcollapse" aria-label="Collapse chat" title="Collapse chat (\)"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M9 3.5 4.5 8 9 12.5M13 3.5 8.5 8 13 12.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="threads" id="threads" role="tablist" aria-label="Agents"></div><button class="iconbtn ghost" id="tx" aria-pressed="false" aria-label="Show steps" title="Show steps"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4h10M3 8h10M3 12h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button></div>
        <div class="feed" id="feed"></div>
        <div class="composer">
          <div class="working" id="working" hidden></div>

            <select id="pick" aria-label="Version"></select>
            <button class="iconbtn" id="next" aria-label="Next version">›</button>
          </div>

          <span class="vnote" id="vnote"></span>

          <div class="canvas" id="canvas"></div>
          <div class="zoomctl"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zfit" aria-label="Fit" style="font-size:12px">Fit</button></div>

    </div>
  </section>
</div>
<div class="pop" id="pop" hidden></div>
<div id="modal"></div>
<div class="toast" id="toast" hidden></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const now = () => new Date().toTimeString().slice(0,5);
const clone = o => JSON.parse(JSON.stringify(o));
const andList = xs => xs.length < 2 ? xs.join('') : xs.slice(0, -1).join(', ') + ' and ' + xs[xs.length - 1];

// =====================================================================
// Artifacts. An artifact is living HTML with versions. Its controls (any
// input, select or textarea with a name) are the user's answers: the app
// collects what changed and hands it to Claude, who posts the next version.
// The KIT is the stylesheet every artifact gets; it reads the app's tokens.
// =====================================================================
const KIT = `
:host{display:block;color:var(--ink);font:15px/1.6 var(--sans)}
*{box-sizing:border-box}
.doc{max-width:900px;margin:0 auto;padding:28px max(16px,4vw) 72px}
.eyebrow{font:500 12px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0}
h1{font-size:26px;line-height:1.2;margin:6px 0 8px;text-wrap:balance}
.lede{font-size:16px;max-width:64ch;margin:0}
h2{font-size:15px;margin:0 0 8px}
section{margin-top:30px}
.hint{color:var(--muted);font-size:13px;margin:-4px 0 10px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
thead th{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap}
.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:13px;white-space:nowrap}
td small{display:block;color:var(--muted);font-size:12.5px}
tfoot td{font-weight:600;border-bottom:0}
.kv th{width:42%;font-weight:500}
.kv .to{font-family:var(--mono);font-size:13px}
.seg{display:inline-flex;border:1px solid var(--stroke);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg label{position:relative;display:block}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{display:block;padding:3px 10px;font-size:12.5px;border-left:1px solid var(--line)}
.seg label:first-child span{border-left:0}
.seg input:checked+span{background:var(--accent);color:var(--on-accent)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:-2px}
.q{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);margin-bottom:10px}
.q p{margin:0;font-weight:500}
.q small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
select,textarea{font:inherit;font-size:14px;color:inherit;background:var(--bg);border:1px solid var(--stroke);border-radius:8px;padding:6px 8px}
.q select,.notes textarea{width:100%;margin-top:8px}
.notes textarea{min-height:76px;resize:vertical}
select.sm{padding:3px 6px;font-size:13px}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;margin:0}
:disabled{opacity:.6;cursor:default}
.dec{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.dec li{display:grid;gap:2px;padding:8px 12px;border-radius:10px;background:var(--add-bg)}
.dec b{font-weight:500}
.dec span{color:var(--add);font-weight:600}
.call{border-radius:12px;padding:14px 16px;background:var(--accent-soft)}
.call b{color:var(--accent)}
.dots{font-family:var(--mono);letter-spacing:1px;color:var(--accent)}
.dots i{font-style:normal;color:var(--line)}
.barc{display:flex;align-items:center;gap:8px;min-width:120px}
.bar{flex:1;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.barc b{font:600 13px var(--mono);min-width:2.5em;text-align:right}
.best td{font-weight:600}
.muted{color:var(--muted)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
.chg-on .chg{background:var(--accent-soft);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 45%,transparent)}
.chg-on section.chg,.chg-on .q.chg,.chg-on .variant.chg{border-radius:14px;padding:12px 14px;margin-inline:-14px}
.chg-on tr.chg{box-shadow:none}
.screens{display:flex;flex-wrap:wrap;gap:28px;margin-top:8px}
.variant{display:grid;gap:10px;justify-items:start;align-content:start}
.variant>label{display:flex;gap:8px;align-items:center;font-weight:600}
.variant>label input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.variant p{margin:0;max-width:250px;font-size:13px;color:var(--muted)}
.phone{width:250px;border:7px solid var(--ink);border-radius:34px;background:var(--bg);overflow:hidden;box-shadow:0 10px 30px var(--shadow)}
.scr{padding:16px 16px 18px;min-height:440px;display:flex;flex-direction:column;gap:10px;font-size:13px}
.ph-top{display:flex;justify-content:space-between;font:12px var(--mono);color:var(--muted)}
.ph-h{font-size:19px;font-weight:600;line-height:1.2}
.ph-s{color:var(--muted);margin-top:-6px}
.tl{list-style:none;margin:4px 0 0;padding:0}
.tl li{position:relative;padding:0 0 14px 20px;border-left:2px solid var(--line);margin-left:6px}
.tl li::before{content:"";position:absolute;left:-7px;top:3px;width:8px;height:8px;border-radius:50%;background:var(--bg);border:2px solid var(--line)}
.tl li.done{border-left-color:var(--add)} .tl li.done::before{background:var(--add);border-color:var(--add)}
.tl li.now::before{background:var(--accent);border-color:var(--accent)}
.tl li:last-child{border-left-color:transparent;padding-bottom:0}
.tl small{display:block;color:var(--muted)}
.map{height:150px;border-radius:14px;background:var(--surface-2);overflow:hidden}
.map svg{display:block;width:100%;height:100%}
.big{font-size:34px;font-weight:600;line-height:1}
.ph-btn{margin-top:auto;border-radius:12px;background:var(--accent);color:var(--on-accent);text-align:center;padding:10px;font-weight:500}
.ph-card{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);display:grid;gap:6px}
.sk{height:9px;border-radius:5px;background:var(--line)}
.opts{display:grid;gap:8px}
.opts label{display:flex;gap:8px;align-items:center}
.spec td:first-child{font-weight:500;width:34%}
`;

// ---- Scope ----
function scopeHtml(d, v, chg){
  const C = id => chg.includes(id) ? ' chg' : '';
  const ins = d.items.filter(i => i.scope === 'in'), days = ins.reduce((s, i) => s + (i.est || 0), 0);
  return `<div class="doc">
  <p class="eyebrow">Scope · v${v} · ${esc(d.status)}</p>
  <h1>${esc(d.title)}</h1>
  <p class="lede">${esc(d.goal)}</p>
  ${d.metrics.length ? `<section class="${C('metrics')}"><h2>Success looks like</h2><div class="tw"><table class="kv"><tbody>${d.metrics.map(m => `<tr><th>${esc(m[0])}</th><td class="to">${esc(m[1])}</td><td class="to">${esc(m[2])}</td></tr>`).join('')}</tbody></table></div></section>` : ''}
  <section class="${C('items')}"><h2>What’s in</h2><p class="hint">Set each item to In, Later or Out. Claude re-plans in the next version.</p>
  <div class="tw"><table><thead><tr><th>Item</th><th class="num">Estimate</th><th>Scope</th></tr></thead><tbody>
  ${d.items.map(i => `<tr class="${C('i-' + i.id)}"><td>${esc(i.text)}${i.note ? `<small>${esc(i.note)}</small>` : ''}</td><td class="num">${i.est ? i.est + ' d' : '—'}</td>
    <td><div class="seg" data-label="${esc(i.text)}">${['in','later','out'].map(s => `<label><input type="radio" name="scope-${i.id}" value="${s}" ${i.scope === s ? 'checked' : ''}><span>${s[0].toUpperCase() + s.slice(1)}</span></label>`).join('')}</div></td></tr>`).join('')}
  </tbody><tfoot><tr><td>In scope</td><td class="num">${days ? days + ' d' : '—'}</td><td>${ins.length} of ${d.items.length} items</td></tr></tfoot></table></div></section>
  ${d.questions.length ? `<section class="${C('questions')}"><h2>Open questions</h2><p class="hint">Claude can’t finish the scope without these.</p>${d.questions.map(q => `<div class="q${C('q-' + q.id)}" data-label="${esc(q.short)}"><p>${esc(q.q)}</p>${q.why ? `<small>${esc(q.why)}</small>` : ''}<select name="q-${q.id}"><option value="">Pick an answer…</option>${q.options.map(o => `<option>${esc(o)}</option>`).join('')}</select></div>`).join('')}</section>` : ''}
  ${d.decisions.length ? `<section class="${C('decisions')}"><h2>Decisions</h2><ul class="dec">${d.decisions.map(x => `<li><b>${esc(x.q)}</b><span>${esc(x.a)}</span></li>`).join('')}</ul></section>` : ''}

const SCOPE_EFFECTS = {
  track(d, a, chg){ if (a.startsWith('Yes')) { d.items.push({id:'track', text:'Order tracking link for guests', note:'Signed link in the confirmation email, valid 30 days', est:2, scope:'in'}); chg.push('i-track'); } },
  psp(d, a, chg){
    const apple = d.items.find(i => i.id === 'wallets');
    if (a.startsWith('Mollie')) { apple.note = 'Mollie supports both wallets: no new contract'; chg.push('i-wallets'); }

  },
  b2b(d, a, chg){ const it = d.items.find(i => i.id === 'b2b'); it.scope = a.startsWith('Yes') ? 'in' : a === 'Later' ? 'later' : 'out'; it.note = ''; chg.push('i-b2b'); },

function scopeApply(d0, ans){

  if (ans.notes?.trim()) { d.asked.push(ans.notes.trim()); chg.push('asked'); said.push('your notes'); }

function researchScores(d){

}

  const dots = n => '●'.repeat(n) + `<i>${'●'.repeat(5 - n)}</i>`;
  return `<div class="doc">

  <section class="${C('weights')}"><h2>Comparison</h2><p class="hint">Change the weights (0 ignores a criterion) and tick the options to keep. Claude re-scores in the next version.</p>
  <div class="tw"><table><thead><tr><th>Criterion</th><th>Weight</th>${d.opts.map(o => `<th>${esc(o.name)}</th>`).join('')}</tr></thead><tbody>

  <tr><td>Cost at our size</td><td></td>${d.opts.map(o => `<td class="num" style="text-align:left">${esc(o.cost)}</td>`).join('')}</tr>
  </tbody><tfoot>
  <tr class="${C('totals')}"><td>Weighted score</td><td></td>${sc.map(o => `<td><div class="barc"><div class="bar"><i style="width:${o.pct}%"></i></div><b>${o.pct}</b></div></td>`).join('')}</tr>

    ${d.bench.rows.map(r => `<tr><td>${esc(d.opts.find(o => o.id === r.id).name)}</td><td><div class="barc"><div class="bar"><i style="width:${Math.min(100, r.p95 / 2.4)}%"></i></div><b>${r.p95}</b></div><small>ms</small></td><td class="num">${r.zero}%</td><td class="num">${r.idx}</td><td class="num">${r.ram}</td></tr>`).join('')}

function researchApply(d0, ans){
  const d = clone(d0), chg = [], said = [];
  d.crit.forEach(c => { const a = ans['w-' + c.id]; if (a !== undefined && +a !== d.w[c.id]) { said.push(`${c.name}: weight ${d.w[c.id]} → ${a}`); d.w[c.id] = +a; chg.push('weights', 'totals', 'rec'); } });
  d.opts.forEach(o => { const a = ans['pick-' + o.id]; if (a === undefined) return; const has = d.short.includes(o.id);
    if (a === 'yes' && !has) { d.short.push(o.id); said.push(`shortlisted ${o.name}`); } if (a === 'no' && has) { d.short = d.short.filter(x => x !== o.id); said.push(`dropped ${o.name}`); } chg.push('rec'); });
  if (ans.notes?.trim()) { d.asked.push(ans.notes.trim()); chg.push('asked'); said.push('your notes'); }
  const pool = researchScores(d).filter(o => !d.short.length || d.short.includes(o.id)).sort((a, b) => b.pct - a.pct);
  return {d, chg, title: `Re-scored with your weights: ${pool[0].name} leads`, note: `${said.length} change${said.length === 1 ? '' : 's'} applied. ${pool[0].name} ${pool[0].pct}, ${pool[1] ? pool[1].name + ' ' + pool[1].pct : ''}.`,

}

function renderPicker(){

function readControls(root){
  const out = {};
  root.querySelectorAll('input[name],select[name],textarea[name]').forEach(el => {
    if (el.type === 'radio') { if (el.checked) out[el.name] = el.value; else if (!(el.name in out)) out[el.name] = ''; }
    else if (el.type === 'checkbox') out[el.name] = el.checked ? 'yes' : 'no';
    else out[el.name] = el.value;
  });
  return out;
}
function renderDoc(force){
  const w = cur(), art = curArt(w), host = $('#doc');

  const key = w.id + ':' + art.id + ':' + art.view;
  if (state.docKey === key && !force) { root.querySelector('.wrap')?.classList.toggle('chg-on', state.hl); return; }
  const ver = art.versions[art.view - 1];
  root.innerHTML = `<style>${KIT}</style><div class="wrap ${state.hl ? 'chg-on' : ''}">${ver ? ver.html : ''}</div>`;
  if (ver) {
    art.defaults[ver.v] ||= readControls(root);
    const ans = art.answers[ver.v] || {};
    root.querySelectorAll('input[name],select[name],textarea[name]').forEach(el => {
      if (!(el.name in ans)) return;
      if (el.type === 'radio') el.checked = el.value === ans[el.name];
      else if (el.type === 'checkbox') el.checked = ans[el.name] === 'yes';
      else el.value = ans[el.name];
    });
    if (ver.v !== latest(art)) root.querySelectorAll('input,select,textarea').forEach(el => el.disabled = true);
  }

  state.docKey = key;
}
function onAnswer(e){
  const el = e.target; if (!el.name) return;

  const val = el.type === 'checkbox' ? (el.checked ? 'yes' : 'no') : el.value;
  (art.answers[v] ||= {})[el.name] = val;
  art.labels[el.name] = el.closest('[data-label]')?.dataset.label || el.name;
  art.texts[el.name] = el.type === 'checkbox' ? (el.checked ? 'Yes' : 'No') : el.type === 'radio' ? (el.parentElement.textContent.trim()) : el.tagName === 'SELECT' ? el.selectedOptions[0]?.textContent : val;
  renderHead(); renderShelfOnly();
}
function renderShelfOnly(){

    const a = artOf(w, b.dataset.tabart), n = pendingAnswers(a).length, p = b.querySelector('.cnt');

// ---- Map: one band per repo, module frames inside ----
const NW = 232, NH = 64, FP = 14, FH = 44, GX = 64, GY = 12, RH = 46, RP = 18, RG = 36;
const allEdges = w => EDGES.concat(w.edges);
function nodesFor(w){
  const changed = new Set(Object.keys(w.changes)), set = new Set(changed);
  allEdges(w).forEach(([a, b]) => { if (changed.has(a)) set.add(b); if (changed.has(b)) set.add(a); });
  const paths = [...set].filter(p => w.rf === 'all' || repoOf(p) === w.rf), keep = new Set(paths);
  return {paths, edges: allEdges(w).filter(([a, b]) => keep.has(a) && keep.has(b))};
}
function layout(w){
  const {paths, edges} = nodesFor(w);
  const pos = {}, frames = [], bands = [];
  let y0 = 0, width = 0, ci = 0;
  w.repos.filter(r => paths.some(p => repoOf(p) === r)).forEach((repo, bi) => {
    const cols = REPOS[repo].mods.filter(m => paths.some(p => repoOf(p) === repo && modOf(p) === m));
    let maxH = 0;
    cols.forEach((m, i) => {
      const files = paths.filter(p => repoOf(p) === repo && modOf(p) === m).sort((a, b) => (w.changes[b] ? 1 : 0) - (w.changes[a] ? 1 : 0) || a.localeCompare(b));
      const x = RP + i * (NW + 2 * FP + GX), y = y0 + RH;
      files.forEach((p, j) => pos[p] = {x: x + FP, y: y + FH + j * (NH + GY), col: ci, band: bi});
      const h = FH + files.length * (NH + GY) - GY + FP;
      frames.push({repo, m, x, y, w: NW + 2 * FP, h});
      maxH = Math.max(maxH, h); ci++;
    });
    const bw = 2 * RP + cols.length * (NW + 2 * FP + GX) - GX, bh = RH + maxH + RP;
    bands.push({repo, y: y0, w: bw, h: bh});
    width = Math.max(width, bw); y0 += bh + RG;
  });
  return {pos, frames, bands, edges, width, height: Math.max(0, y0 - RG)};
}
function renderMap(refit, freshPath){
  const w = cur(), art = curArt(w), L = layout(w), cv = $('#canvas');
  if (!Object.keys(L.pos).length) { cv.innerHTML = `<div class="empty">Nothing changed${w.rf === 'all' ? '' : ' in ' + w.rf} yet.<br>Claude’s edits show here as they happen.</div>`; cv.dataset.w = 0; cv.dataset.key = ''; return; }
  const pv = art.view === 'live' ? null : w.posts.find(p => p.art === art.id && p.v === art.view);
  const inView = p => w.changes[p] && (!pv || pv.files.includes(p));
  const edges = L.edges.map(([a, b]) => {
    const P = L.pos[a], Q = L.pos[b];
    let d;
    if (P.band !== Q.band) { const x1 = P.x + NW / 2, y1 = P.y + NH, x2 = Q.x + NW / 2, y2 = Q.y - 4; d = `M${x1} ${y1} C${x1} ${y1 + 60} ${x2} ${y2 - 60} ${x2} ${y2}`; }
    else if (P.col === Q.col) { const x = P.x + NW, y1 = P.y + NH / 2, y2 = Q.y + NH / 2; d = `M${x} ${y1} C${x + 40} ${y1} ${x + 40} ${y2} ${x + 4} ${y2}`; }
    else if (P.col < Q.col) { const x1 = P.x + NW, x2 = Q.x - 4, y1 = P.y + NH / 2, y2 = Q.y + NH / 2, mx = (x1 + x2) / 2; d = `M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}`; }
    else { const x1 = P.x, x2 = Q.x + NW + 4, y1 = P.y + NH / 2, y2 = Q.y + NH / 2, mx = (x1 + x2) / 2; d = `M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}`; }
    const hot = state.sel && (a === state.sel || b === state.sel);
    return `<path class="edge ${hot ? 'hot' : ''}" d="${d}" marker-end="url(#ar${hot ? 'h' : ''})"/>`;
  }).join('');
  const bands = L.bands.map(b => { const s = wsStat(w, b.repo); return `<g class="rfr"><rect x="0" y="${b.y}" width="${b.w}" height="${b.h}" rx="16"/><text class="rn" x="${RP}" y="${b.y + 28}">${b.repo}</text><text class="rk" x="${RP + 8 + b.repo.length * 8.6}" y="${b.y + 28}">${REPOS[b.repo].kind} · ${esc(w.branch)} from ${w.bases[b.repo]} · +${s.a} −${s.d}</text></g>`; }).join('');
  const frames = L.frames.map(f => `<g class="mod"><rect x="${f.x}" y="${f.y}" width="${f.w}" height="${f.h}" rx="12"/><text class="mn" x="${f.x + FP}" y="${f.y + 20}">${modLabel(f.repo, f.m)}</text><text class="mp" x="${f.x + FP}" y="${f.y + 35}">src/${f.m ? f.m + '/' : ''}</text></g>`).join('');
  const nodes = Object.entries(L.pos).map(([p, {x, y}]) => {
    const c = w.changes[p], on = inView(p);
    const r = rel(p).split('/'), name = r.pop(), dir = r.slice(1).join('/');
    const s = c ? stat(c.hunks) : null;
    const unviewed = c && w.viewed[p] !== sig(c);
    const cc = w.comments.filter(k => k.path === p).length;
    const cls = ['node', on ? 's-' + c.s : 'ctx', state.sel === p ? 'sel' : '', freshPath === p ? 'fresh' : ''].join(' ');
    return `<g class="${cls}" data-path="${p}" transform="translate(${x},${y})" tabindex="0" role="button" aria-label="${name}">
      <rect class="box" width="${NW}" height="${NH}" rx="9"/><rect class="bar" x="6" y="10" width="3.5" height="${NH - 20}" rx="1.75"/>
      <text class="nm" x="20" y="27">${esc(name)}</text>
      <text class="pth" x="20" y="46">${esc(dir ? dir + '/' : 'src/')}</text>
      ${c ? `<text class="meta" x="${NW - 12}" y="27" text-anchor="end">${on ? `<tspan class="a">+${s.a}</tspan> <tspan class="d">−${s.d}</tspan>` : `not in #${pv.id}`}</text>` : `<text class="meta" x="${NW - 12}" y="27" text-anchor="end">context</text>`}
      ${unviewed && on ? `<g class="nv" transform="translate(${NW - 30},38)"><title>Not viewed</title><path d="M1 6 C4 1 12 1 15 6 C12 11 4 11 1 6Z"/><circle cx="8" cy="6" r="2"/></g>` : ''}
      ${cc ? `<g transform="translate(${NW - (unviewed && on ? 50 : 26)},37)"><circle class="cc" cx="7" cy="7" r="8"/><text class="cct" x="7" y="10.5" text-anchor="middle">${cc}</text></g>` : ''}
    </g>`;
  }).join('');
  cv.innerHTML = `<svg width="${L.width + 40}" height="${L.height + 40}" viewBox="-20 -20 ${L.width + 40} ${L.height + 40}">
    <defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="arrow" d="M0 0L8 4L0 8z"/></marker>
    <marker id="arh" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" style="fill:var(--accent)"/></marker></defs>
    ${bands}${frames}${edges}${nodes}</svg>`;
  const key = w.id + '|' + w.rf + '|' + L.bands.length, grew = cv.dataset.key !== key;
  cv.dataset.w = L.width + 40; cv.dataset.h = L.height + 40; cv.dataset.key = key;
  if (refit || grew) fit(); else applyView();
}
function applyView(){ const s = $('#canvas svg'); if (s) s.style.transform = `translate(${state.view.x}px,${state.view.y}px) scale(${state.view.k})`; }
function fit(){
  const cv = $('#canvas'), bw = +cv.dataset.w, bh = +cv.dataset.h;
  if (!bw || !cv.clientWidth) return;
  const k = Math.min(1.1, (cv.clientWidth - 24) / bw, (cv.clientHeight - 24) / bh);
  state.view = {k, x: (cv.clientWidth - bw * k) / 2, y: Math.max(8, (cv.clientHeight - bh * k) / 2)};
  applyView();
}
function zoom(f, cx, cy){
  const cv = $('#canvas'), v = state.view;
  cx ??= cv.clientWidth / 2; cy ??= cv.clientHeight / 2;
  const k = Math.min(2.5, Math.max(.2, v.k * f));
  v.x = cx - (cx - v.x) * k / v.k; v.y = cy - (cy - v.y) * k / v.k; v.k = k; applyView();
}

// ---- Sheet: one file of the map ----
function hl(src){
  const re = /(\/\/.*$)|('[^']*'|`[^`]*`|"[^"]*")|(@\w+)|\b(import|from|export|class|const|let|return|async|await|private|readonly|constructor|extends|if|throw|new|function|interface|null|true|false|this|super|implements)\b/g;
  let out = '', i = 0;
  src.replace(re, (m, c, s, d, k, off) => { out += esc(src.slice(i, off)) + `<span class="${c ? 'com' : s ? 'str' : d ? 'dec' : 'kw'}">${esc(m)}</span>`; i = off + m.length; return m; });
  return out + esc(src.slice(i));
}
function symAt(c, code){ return (c.syms.find(s => code.includes(s.n.split('.').pop())) || c.syms[0] || {}).n; }
function renderSheet(){
  const w = cur(), p = curArt(w).kind === 'dyffle' ? state.sel : null, sh = $('#sheet');
  $('#body').classList.toggle('withsheet', !!p);
  sh.hidden = !p;
  if (!p) return;
  const c = w.changes[p], name = p.split('/').pop();
  const head = `<div class="shhd"><div><h3>${esc(name)}</h3><span class="rtag">${repoOf(p)}</span><code>${esc(rel(p))}</code></div><button class="iconbtn" id="shclose" aria-label="Close">✕</button></div>`;
  if (!c) {
    const refs = allEdges(w).filter(e => e.includes(p)).map(([a, b]) => a === p ? `references <code>${b.split('/').pop()}</code>` : `referenced by <code>${a.split('/').pop()}</code>`);
    sh.innerHTML = head + `<div class="ctxinfo"><p>Unchanged on this branch. It is on the map because it touches changed code:</p><ul>${refs.map(r => `<li>${r}</li>`).join('')}</ul></div>`;
    return;
  }
  const s = stat(c.hunks), v = w.viewed[p], isV = v === sig(c);
  let rows = '';
  c.hunks.forEach(h => {
    let o = h.o, n = h.n;
    rows += `<div class="hh">@@ −${h.o} +${h.n} @@ ${esc(symAt(c, h.lines.join(' ')) || '')}</div>`;
    h.lines.forEach(l => {
      const t = l[0] === '+' ? 'add' : l[0] === '-' ? 'del' : 'ctx', code = l.slice(1);
      const ol = t === 'add' ? '' : o++, nl = t === 'del' ? '' : n++;
      const side = t === 'del' ? 'L' : 'R', line = t === 'del' ? ol : nl, key = `${p}|${side}|${line}`;
      rows += `<div class="dl ${t}"><button class="addc" data-addc="${esc(key)}" data-code="${esc(code)}" aria-label="Comment on line ${line}">+</button><span class="ln">${ol}</span><span class="ln">${nl}</span><span class="cd">${hl(code) || ' '}</span></div>`;
      w.comments.filter(k => k.key === key).forEach(k => rows += `<div class="thread"><div class="row"><b>You</b><button data-delc="${k.id}">Delete</button></div><p>${esc(k.body)}</p></div>`);
      if (state.editing && state.editing.key === key) rows += `<div class="thread"><textarea id="cedit" placeholder="Leave a comment for Claude…"></textarea><div class="acts"><button class="btn" id="ccancel">Cancel</button><button class="btn primary" id="csave">Add comment</button></div></div>`;
    });
  });
  sh.innerHTML = head + `
    <div class="shbar"><span class="pill ${c.s === 'added' ? 'st-review' : 'st-input'}"><i></i>${c.s === 'added' ? 'Added' : 'Modified'}</span>
      <span class="stl"><span class="a">+${s.a}</span> <span class="d">−${s.d}</span></span>
      <label class="switch" style="margin-left:auto"><input type="checkbox" id="viewed" ${isV ? 'checked' : ''}> Viewed</label>
      ${v && !isV ? '<span class="since">Changed since viewed</span>' : ''}</div>
    <div class="syms">${c.syms.map(y => `<span class="sym ${y.s}">${esc(y.n)}</span>`).join('')}</div>
    <div class="diff" id="diff">${rows}</div>`;
  const ed = $('#cedit'); if (ed) ed.focus();
}

function renderAll(refit){ renderSide(); renderHead(); renderThreads(); renderFeed(); renderStage(refit, null, true); }
function refresh(w, freshPath, newVersion){
  renderSide();
  if (w.id !== state.cur) return;
  renderHead(); renderThreads(); renderFeed(true);
  if (!state.editing) renderStage(false, freshPath, newVersion);
}

const camel = s => { const ws = s.toLowerCase().replace(/[^a-z ]/g, '').split(' ').filter(Boolean).slice(0, 3); return (ws[0] || 'step') + ws.slice(1).map(x => x[0].toUpperCase() + x.slice(1)).join(''); };
const slug = s => s.toLowerCase().replace(/[^a-z0-9 ]/g, '').trim().split(/\s+/).slice(0, 4).join('-') || 'task';
const shorten = s => { s = s.replace(/\s+/g, ' '); return s.length > 60 ? s.slice(0, 59) + '…' : s; };

// Everything waiting to be sent: changed controls per artifact, and line comments on the map.
function collect(w){

  if (!t) { if (!e.target.closest('#pop') && !$('#pop').hidden) closePop(); return; }
  const w = cur(), art = curArt(w);
  if (t.dataset.ws) return select(t.dataset.ws);
  if (t.dataset.thread) return setThread(t.dataset.thread);
  if (t.dataset.art) { const a = artOf(w, t.dataset.art), v = +t.dataset.ver; return openArt(t.dataset.art, a.kind === 'dyffle' && a.view === v && w.cur === a.id ? 'live' : v); }
  if (t.dataset.tabart) return openArt(t.dataset.tabart);
  if (t.dataset.gover) { art.view = +t.dataset.gover; return renderStage(false); }
  if (t.dataset.path && t.matches('.node,.ref')) { if (dragged) return; return selectPath(t.dataset.path); }
  if (t.dataset.tab) return setTab(t.dataset.tab);
  if (t.dataset.rf) { w.rf = t.dataset.rf; renderPicker(); return renderMap(true); }
  if (t.dataset.addc) { const [path, side, line] = t.dataset.addc.split('|'); state.editing = {key: t.dataset.addc, path, side, line: +line, code: t.dataset.code}; return renderSheet(); }
  if (t.dataset.delc) { w.comments = w.comments.filter(c => c.id !== +t.dataset.delc); renderHead(); renderMap(false); if (!$('#pop').hidden) openSend($('#revbtn')); if (!state.editing) renderSheet(); return; }
  switch (t.id) {
    case 'newws': return openNew();
    case 'addag': return openAgent();
    case 'chatcollapse': return setChat(false);
    case 'chattab': return setChat(true);
    case 'tx': state.tx = !state.tx; t.setAttribute('aria-pressed', String(state.tx)); return renderFeed(true);
    case 'menubtn': return $('#side').classList.toggle('open');
    case 'stopbtn': return stop(w, agOf(w, t.dataset.ag));
    case 'revbtn': return $('#pop').hidden ? openSend(t) : closePop();
    case 'popclose': return closePop();
    case 'sendall': w.overall = $('#overall').value; return sendAll();
    case 'prbtn': return openPR();
    case 'mclose': return closeModal();
    case 'shclose': state.sel = null; state.editing = null; return renderStage(false);
    case 'ccancel': state.editing = null; return renderSheet();
    case 'csave': {
      const body = $('#cedit').value.trim(); if (!body) return;
      const ed = state.editing, c = w.changes[ed.path];
      w.comments.push({id: Date.now(), key: ed.key, path: ed.path, side: ed.side, line: ed.line, code: ed.code, body, symbol: symAt(c, ed.code)});
      state.editing = null; renderSheet(); renderHead(); renderMap(false); return;
    }
    case 'prev': case 'next': {
      if (art.kind === 'dyffle') {
        const vs = w.posts.filter(p => p.art === art.id).map(p => p.v).concat('live'), i = vs.indexOf(art.view);
        const j = i + (t.id === 'next' ? 1 : -1); if (j >= 0 && j < vs.length) { art.view = vs[j]; renderFeed(true); renderStage(false); }
      } else { const v = art.view + (t.id === 'next' ? 1 : -1); if (v >= 1 && v <= latest(art)) { art.view = v; renderFeed(true); renderStage(false); } }
      return;
    }
    case 'zin': return zoom(1.2);
    case 'zout': return zoom(1 / 1.2);
    case 'zfit': return fit();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closePop(); closeModal(); $('#side').classList.remove('open'); }
  const tgt = e.composedPath()[0];
  if (e.key === '\\' && !e.metaKey && !e.ctrlKey && !(tgt.closest && tgt.closest('input,textarea,select'))) { e.preventDefault(); setChat(!state.chat); }
  if (e.key === 'Enter' && e.target.matches('.node')) selectPath(e.target.dataset.path);
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && e.target.id === 'cin') $('#cform').requestSubmit();
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && e.target.id === 'cedit') $('#csave').click();
});
document.addEventListener('mousedown', e => { if (e.target.id === 'scrim') closeModal(); });
document.addEventListener('change', e => {
  const w = cur(), art = curArt(w);
  if (e.target.id === 'viewed') { if (e.target.checked) w.viewed[state.sel] = sig(w.changes[state.sel]); else delete w.viewed[state.sel]; renderSheet(); renderMap(false); }
  if (e.target.id === 'hl') { state.hl = e.target.checked; renderDoc(); }
  if (e.target.id === 'cto') { w.to = e.target.value; renderFeed(true); }
  if (e.target.id === 'pick') { art.view = e.target.value === 'live' ? 'live' : +e.target.value; renderFeed(true); renderStage(false); }
});
document.addEventListener('input', e => { if (e.target.id === 'overall') cur().overall = e.target.value; });
const docHost = $('#doc'); docHost.attachShadow({mode:'open'});
docHost.shadowRoot.addEventListener('input', onAnswer);
docHost.shadowRoot.addEventListener('change', onAnswer);
$('#cform').addEventListener('submit', e => {
  e.preventDefault();
  const w = cur(), text = $('#cin').value.trim(), ag = threadOf(w);
  if (!text || !ag) return;
  if (ag.status === 'running') { toast(`${ag.name} is busy. Stop it first, or wait for its next post.`); return; }
  $('#cin').value = '';
  if (Object.keys(w.prs).length && ag.role === 'coder') w.feed.push({k:'status', text:`New commits go to ${andList(Object.keys(w.prs).map(r => prLabel(w, r)))}`});
  talk(w, ag, text);
});

// Pan and zoom
const cv = $('#canvas');
let pan = null;
cv.addEventListener('pointerdown', e => { if (e.button !== 0) return; pan = {x: e.clientX, y: e.clientY, vx: state.view.x, vy: state.view.y}; dragged = false; });
addEventListener('pointermove', e => {
  if (!pan) return;
  const dx = e.clientX - pan.x, dy = e.clientY - pan.y;
  if (!dragged && Math.hypot(dx, dy) < 4) return;
  dragged = true; cv.classList.add('panning');
  state.view.x = pan.vx + dx; state.view.y = pan.vy + dy; applyView();
});
addEventListener('pointerup', () => { pan = null; cv.classList.remove('panning'); setTimeout(() => dragged = false, 0); });
cv.addEventListener('wheel', e => { e.preventDefault(); const r = cv.getBoundingClientRect(); zoom(e.deltaY < 0 ? 1.1 : 1 / 1.1, e.clientX - r.left, e.clientY - r.top); }, {passive: false});
addEventListener('resize', () => { placeTab(); if (curArt(cur())?.kind === 'dyffle') fit(); });

// Boot: the Researcher in Catalog search is mid-run and posts its benchmark as v2.
let chatOn = true;
try { chatOn = localStorage.getItem('conduct.chat') !== '0'; } catch (e) {}
setChat(chatOn, true);
renderAll(true);
(() => {
  const r = byId('search'), researcher = r.agents[0], ra = r.arts[0];
  const d = clone(ra.data);
  d.bench = {how:'The 200 most common searches from last month’s logs, against all 120k products, on one 4 GB machine each.', rows:[
    {id:'meili', p95:38, zero:1.8, idx:'4 min', ram:'1.1 GB'}, {id:'typesense', p95:29, zero:2.1, idx:'3 min', ram:'1.6 GB'},
    {id:'elastic', p95:64, zero:1.5, idx:'9 min', ram:'3.2 GB'}, {id:'pg', p95:212, zero:6.4, idx:'—', ram:'existing'}]};
  run(r, researcher, [
    [2200, ...tool('Bash node bench/load-catalog.js --products 120000')],
    [2600, ...tool('Bash node bench/run.js --queries logs/top-200-searches.txt')],
    [2400, ...tool(`Write ${ra.title} v2`)],
    [1600, 'version', {art: ra.id, d, chg: ['bench'], note: 'Benchmark on our own catalog: latency, zero results, indexing, memory.', title: 'Benchmark on our catalog',
      msg: 'Ran the 200 most common searches against all 120k products. **Typesense** is fastest (29 ms p95), **Elasticsearch** finds the most, and Postgres misses 6.4% of searches.\n\nSet the weights to what matters to you and shortlist; I’ll re-score.'}],
    [300, 'status', 'review'],
  ]);
})();
</script>
